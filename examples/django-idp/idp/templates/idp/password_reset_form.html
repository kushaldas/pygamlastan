{% extends "idp/base.html" %}
{% block title %}Forgot password | IdP{% endblock %}
{% block content %}
<main>
  <h1 class="profile-heading">Forgot password?</h1>
  <p>Enter your account email address to request a password reset link.</p>
  <form method="post" class="profile-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Request reset link</button>
  </form>
  <p><a href="{% url 'idp:login' %}">Back to sign in</a></p>
</main>
{% endblock %}
